name: Issue & PR Triage

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome First-time Contributors
    runs-on: ubuntu-latest
    steps:
      - name: Greet Contributor
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: '👋 Thanks for opening your first issue in this repository! We appreciate your contribution and will review it soon.'
          pr-message: '🎉 Thanks for your first pull request! The maintainers will review your contribution shortly. Please ensure all tests pass.'
