name: 🐛 Bug Report
description: Create a report to help us reproduce and fix a bug
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I run kblight, it fails to...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you running kblight on?
      options:
        - macOS (Apple Silicon - M1/M2/M3/M4)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Linux (Arch/Fedora/Other)
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Run `python3 --version` and paste the output.
      placeholder: "e.g. Python 3.11.8"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Keyboard / Lighting Backend
      description: Which lighting backend or hardware are you using?
      options:
        - Apple MacBook built-in keyboard backlight (CoreAudio / pyobjc)
        - OpenRGB
        - Custom / Other
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Run 'kblight --debug'
        2. Play audio in browser or music player
        3. See error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug Logs / Terminal Output
      description: Paste any output from `kblight --debug` or terminal error stack traces here.
      render: shell
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have verified this bug exists on the latest version of the repository.
          required: true
        - label: I searched existing GitHub issues and did not find a duplicate.
          required: true
