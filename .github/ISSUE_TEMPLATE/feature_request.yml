name: 💡 Feature Request
description: Suggest an idea or feature for this project
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate suggestions for new features and improvements!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem or specific use case?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new feature you'd like to see.
      placeholder: Add support for...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or hardware specifications.
    validations:
      required: false
