[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kblight"
version = "0.1.0"
description = "Sync a keyboard backlight to live audio"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.2.6",
    "requests>=2.31",
    "soundcard>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "black>=26.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "ruff>=0.6",
]
macos = [
    "pyobjc-core>=12.2.2",
    "pyobjc-framework-Cocoa>=12.2.2",
]
openrgb = ["openrgb-python>=0.3.8"]

[project.scripts]
kblight = "kblight:main"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
